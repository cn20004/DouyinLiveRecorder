name: Build Zhenglaoshi Mod Windows EXE
on:
  push:
    branches: [zhenglaoshi-url-config-safety]
    paths: ['main.py', 'launcher.py', 'src/**', 'config/**', 'tests/**', '.github/workflows/build-zhenglaoshi-windows.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build-windows:
    runs-on: windows-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install and test
        shell: pwsh
        run: |
          python -m pip install -r requirements.txt pyinstaller
          python -m unittest discover -s tests -v
      - name: Compile both EXEs
        shell: pwsh
        run: |
          pyinstaller --noconfirm --clean --console --onedir --name DouyinLiveRecorder-Core --collect-all httpx --collect-all loguru --collect-all Crypto main.py
          pyinstaller --noconfirm --clean --windowed --onedir --name Zhenglaoshi-DouyinLive-v1.1.0 --collect-all loguru launcher.py
          $pkg = 'dist/Zhenglaoshi-DouyinLive-v1.1.0'
          Copy-Item dist/DouyinLiveRecorder-Core/* $pkg -Recurse -Force
          New-Item -ItemType Directory -Force "$pkg/config","$pkg/runtime","$pkg/data","$pkg/downloads","$pkg/backup_config" | Out-Null
          Copy-Item config/* "$pkg/config" -Force
          New-Item -ItemType Directory -Force "$pkg/src" | Out-Null
          Copy-Item src/javascript "$pkg/src/javascript" -Recurse -Force
          Copy-Item LICENSE "$pkg/LICENSE-Recorder.txt"
          Copy-Item (Get-Command node).Source "$pkg/runtime/node.exe"
      - name: Bundle collector and Chromium
        shell: pwsh
        run: |
          $pkg = (Resolve-Path dist/Zhenglaoshi-DouyinLive-v1.1.0).Path
          git clone https://github.com/ymstar/dyhub.git "$pkg/runtime/dyhub"
          Push-Location "$pkg/runtime/dyhub"
          git checkout ad31eeaae91842a4fffc6c2415026e2bbf524126
          npm ci --no-audit --no-fund
          if ($LASTEXITCODE) { throw 'Collector dependencies failed' }
          npx tsc -p tsconfig.json
          if ($LASTEXITCODE) { throw 'Collector compile failed' }
          Copy-Item src/ui dist/ui -Recurse -Force
          $env:PLAYWRIGHT_BROWSERS_PATH = "$pkg/runtime/browsers"
          node node_modules/playwright-core/cli.js install chromium
          if ($LASTEXITCODE) { throw 'Chromium download failed' }
          npm prune --omit=dev --no-audit --no-fund
          Remove-Item .git,src -Recurse -Force
          Pop-Location
      - name: Bundle FFmpeg and instructions
        shell: pwsh
        run: |
          $pkg = 'dist/Zhenglaoshi-DouyinLive-v1.1.0'
          Invoke-WebRequest 'https://www.gyan.dev/ffmpeg/builds/ffmpeg-release-essentials.zip' -OutFile ffmpeg.zip
          Expand-Archive ffmpeg.zip ffmpeg-temp
          New-Item -ItemType Directory -Force "$pkg/ffmpeg" | Out-Null
          Get-ChildItem ffmpeg-temp -Filter '*.exe' -Recurse | Copy-Item -Destination "$pkg/ffmpeg"
          Get-ChildItem ffmpeg-temp -Filter 'LICENSE*' -Recurse | Copy-Item -Destination "$pkg/ffmpeg"
          @'
          郑老师魔改版 v1.1.0 / ZL-DLR-20260930-02
          解压全部文件后双击 Zhenglaoshi-DouyinLive-v1.1.0.exe。
          在窗口填写直播地址，每行一个，点击开始录制。
          Node.js、Chromium、FFmpeg及采集服务均已包含，无需安装Git或Python。
          开播后自动启动评论和人数采集；实时数据按钮打开采集页面。
          导出历史CSV可导出已保存评论、人数及采集状态。
          配置位于config，录像位于downloads，数据库默认data/douyin_live.db。
          不能获取未监听时的历史评论。网络、直播状态及平台验证会影响采集。
          采集日志：logs/collector.log。不要只移动EXE，必须保留整个文件夹。
          '@ | Set-Content "$pkg/使用说明.txt" -Encoding utf8
      - name: Verify Windows executables
        shell: pwsh
        run: |
          $exe = (Resolve-Path dist/Zhenglaoshi-DouyinLive-v1.1.0/Zhenglaoshi-DouyinLive-v1.1.0.exe).Path
          $p = Start-Process $exe -ArgumentList '--self-test' -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw "Package self-test failed: $($p.ExitCode)" }
          $env:PYTHONPATH = (Get-Location).Path
          python tests/windows_package_smoke.py dist/Zhenglaoshi-DouyinLive-v1.1.0
          python -c "from pathlib import Path; files=list(Path('dist/Zhenglaoshi-DouyinLive-v1.1.0').glob('*.exe')); assert len(files)==2; assert all(p.read_bytes()[:2]==b'MZ' for p in files)"
      - name: Package and publish
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $zip = 'DouyinLiveRecorder-Zhenglaoshi-Mod-v1.1.0-Windows-x64.zip'
          Compress-Archive -Path dist/Zhenglaoshi-DouyinLive-v1.1.0/* -DestinationPath $zip
          Get-FileHash $zip -Algorithm SHA256 | ForEach-Object { "$($_.Hash.ToLower())  $zip" } | Set-Content checksums.sha256
          gh release create zhenglaoshi-v1.1.0 $zip checksums.sha256 --target '${{ github.sha }}' --title '郑老师魔改版 v1.1.0 Windows EXE' --notes '包含桌面启动器、直播录制核心、评论/人数持久化、配置原子写入与恢复、历史CSV导出；内置Node、Chromium及FFmpeg。'
          if ($LASTEXITCODE) { throw 'Release publish failed' }
      - uses: actions/upload-artifact@v4
        with:
          name: Zhenglaoshi-DouyinLive-v1.1.0-Windows-x64
          path: |
            DouyinLiveRecorder-Zhenglaoshi-Mod-v1.1.0-Windows-x64.zip
            checksums.sha256
          retention-days: 30
