name: Package Zhenglaoshi Windows Installer
on:
  push:
    branches: [zhenglaoshi-url-config-safety]
    paths: ['packaging/installer.nsi', '.github/workflows/package-zhenglaoshi-installer.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  installer:
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Download verified portable package
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ready = $false
          for ($i=0; $i -lt 90; $i++) {
            gh release download zhenglaoshi-v1.1.1 -R '${{ github.repository }}' -p 'DouyinLiveRecorder-Zhenglaoshi-Mod-v1.1.1-Windows-x64.zip' --clobber
            if ($LASTEXITCODE -eq 0) { $ready=$true; break }
            Start-Sleep -Seconds 10
          }
          if (!$ready) { throw 'Verified portable release not available' }
          Expand-Archive DouyinLiveRecorder-Zhenglaoshi-Mod-v1.1.1-Windows-x64.zip package
      - name: Build installer
        shell: pwsh
        run: |
          Invoke-WebRequest 'https://github.com/electron-userland/electron-builder-binaries/releases/download/nsis-3.0.4.1/nsis-3.0.4.1.7z' -OutFile nsis.7z
          7z x nsis.7z -onsis -y
          if ($LASTEXITCODE) { throw 'NSIS extraction failed' }
          $compiler = (Get-ChildItem nsis -Filter makensis.exe -Recurse | Select-Object -First 1).FullName
          if (!$compiler) { throw 'NSIS compiler missing' }
          & $compiler /NOCD packaging/installer.nsi
          if ($LASTEXITCODE) { throw 'NSIS build failed' }
      - name: Test installation and application
        shell: pwsh
        run: |
          $installer = (Get-ChildItem -Recurse -Filter 'Zhenglaoshi-DouyinLive-Setup-v1.1.1.exe' | Select-Object -First 1).FullName
          $dest = 'C:\ZhenglaoshiInstallSmoke'
          $p = Start-Process $installer -ArgumentList '/S',"/D=$dest" -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw 'Installation failed' }
          $p = Start-Process "$dest/Zhenglaoshi-DouyinLive-v1.1.1.exe" -ArgumentList '--self-test' -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw 'Installed application self-test failed' }
      - name: Publish final EXE
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload zhenglaoshi-v1.1.1 Zhenglaoshi-DouyinLive-Setup-v1.1.1.exe -R '${{ github.repository }}' --clobber
          if ($LASTEXITCODE) { throw 'Installer upload failed' }
      - uses: actions/upload-artifact@v4
        with:
          name: Zhenglaoshi-DouyinLive-Setup-v1.1.1
          path: Zhenglaoshi-DouyinLive-Setup-v1.1.1.exe
